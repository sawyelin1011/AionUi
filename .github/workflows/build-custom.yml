name: Build Custom Release

on:
  push:
    branches: [release-custom]
  workflow_run:
    workflows: [Sync Upstream & Build]
    types: [completed]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-custom
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Check AionCore backend
        run: |
          if "${{ matrix.os }}" == "windows-latest"; then
            where.exe aioncore 2>$null && echo "aioncore found" || echo "aioncore not found"
          else
            which aioncore 2>/dev/null && echo "aioncore found" || echo "aioncore not found"
          fi

      - name: Build
        run: |
          if "${{ matrix.os }}" == "windows-latest"; then bun run build-win:x64; fi
          if "${{ matrix.os }}" == "ubuntu-latest"; then bun run build-deb; fi
          if "${{ matrix.os }}" == "macos-latest"; then bun run build-mac; fi

      - uses: actions/upload-artifact@v4
        with:
          name: AionUi-custom-${{ matrix.os }}
          path: release/
